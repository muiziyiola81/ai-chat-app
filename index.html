<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header>
      <h1>AI Assistant</h1>
    </header>

    <main id="chatBox">
      <div class="message ai">
        Hello! 👋 How can I help you today?
      </div>
    </main>

    <div class="input-area">

      <!-- Message input -->
      <textarea
        id="userInput"
        placeholder="Ask anything..."
        rows="1"
      ></textarea>

      <!-- Hidden file picker -->
      <input
        type="file"
        id="fileInput"
        hidden
      >

      <!-- Bottom controls -->
      <div class="input-controls">

        <div class="left-controls">

          <!-- Upload -->
          <button
            type="button"
            id="uploadButton"
            title="Upload a file"
          >
            📎
          </button>

          <!-- Think harder -->
          <button
            type="button"
            id="thinkButton"
            title="Think harder"
          >
            🧠 Think harder
          </button>

          <!-- Speech to text -->
          <button
            type="button"
            id="micButton"
            title="Speech to text"
          >
            🎤
          </button>

        </div>

        <!-- Send -->
        <button
          type="button"
          id="sendButton"
          title="Send message"
        >
          ➤
        </button>

      </div>

      <!-- Selected file name -->
      <div id="fileName"></div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
