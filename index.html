<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header>
      <h1>AI Assistant</h1>
    </header>

    <main id="chatBox">

      <div class="message ai">
        Hello! 👋 How can I help you today?
      </div>

    </main>

    <div class="input-area">

      <!-- Message input -->
      <textarea
        id="userInput"
        placeholder="Ask anything..."
        rows="1"
      ></textarea>

      <!-- Hidden file picker -->
      <input
        type="file"
        id="fileInput"
        hidden
      >

      <!-- Bottom controls -->
      <div class="input-controls">

        <div class="left-controls">

          <!-- Upload button -->
          <button
            type="button"
            id="uploadButton"
            title="Upload a file"
            aria-label="Upload a file"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M21.44 11.05L12.25 20.24C9.91 22.58 6.11 22.58 3.77 20.24C1.43 17.9 1.43 14.1 3.77 11.76L12.96 2.57C14.72 0.81 17.58 0.81 19.34 2.57C21.1 4.33 21.1 7.19 19.34 8.95L10.15 18.14C8.98 19.31 7.08 19.31 5.91 18.14C4.74 16.97 4.74 15.07 5.91 13.9L14.75 5.06"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>


          <!-- Think harder button -->
          <button
            type="button"
            id="thinkButton"
            title="Think harder"
            aria-label="Think harder"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M9 18H15"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />

              <path
                d="M10 22H14"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />

              <path
                d="M8.5 14.5C7 13.45 6 11.72 6 9.75C6 6.57 8.69 4 12 4C15.31 4 18 6.57 18 9.75C18 11.72 17 13.45 15.5 14.5C14.56 15.16 14 16.24 14 17.5H10C10 16.24 9.44 15.16 8.5 14.5Z"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />

              <path
                d="M9 8.5C9.55 7.58 10.55 7 12 7"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>

            <span>Think harder</span>
          </button>


          <!-- Microphone button -->
          <button
            type="button"
            id="micButton"
            title="Speech to text"
            aria-label="Speech to text"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M12 14C13.66 14 15 12.66 15 11V5C15 3.34 13.66 2 12 2C10.34 2 9 3.34 9 5V11C9 12.66 10.34 14 12 14Z"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />

              <path
                d="M19 11C19 14.87 15.87 18 12 18C8.13 18 5 14.87 5 11"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />

              <path
                d="M12 18V22"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />

              <path
                d="M9 22H15"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </button>

        </div>


        <!-- Send button -->
        <button
          type="button"
          id="sendButton"
          title="Send message"
          aria-label="Send message"
        >
          ➤
        </button>

      </div>


      <!-- Selected file -->
      <div id="fileName"></div>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
