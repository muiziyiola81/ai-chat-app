<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <header>
    <h1>AI Assistant</h1>
  </header>

  <main id="chatBox">
    <div class="message ai">
      Hello! How can I help you today?
    </div>
  </main>

  <div class="input-area">

    <!-- TOOLS MENU -->
    <div class="tools-menu" id="toolsMenu">

      <!-- UPLOAD -->
      <button id="uploadButton" type="button" title="Upload">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </button>

      <!-- THINK -->
      <button id="thinkButton" type="button" title="Think">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M9 18h6"/>
          <path d="M10 22h4"/>
          <path d="M8.5 14.5C7.6 13.7 7 12.4 7 11a5 5 0 0 1 10 0c0 1.4-.6 2.7-1.5 3.5-.7.6-1.1 1.2-1.3 2.5h-4.4c-.2-1.3-.6-1.9-1.3-2.5z"/>
          <path d="M12 2V1"/>
          <path d="M4.9 4.9 4.2 4.2"/>
          <path d="M19.1 4.9l.7-.7"/>
        </svg>
      </button>

      <!-- CAMERA -->
      <button id="cameraButton" type="button" title="Camera">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M14.5 4h-5L8 6H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3z"/>
          <circle cx="12" cy="13" r="3.5"/>
        </svg>
      </button>

      <!-- PHOTO -->
      <button id="photoButton" type="button" title="Photo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <circle cx="8.5" cy="9" r="1.5"/>
          <path d="m21 15-5-5L5 20"/>
        </svg>
      </button>

      <!-- MICROPHONE -->
      <button id="micButton" type="button" title="Microphone">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0"/>
          <line x1="12" y1="18" x2="12" y2="22"/>
          <line x1="8" y1="22" x2="16" y2="22"/>
        </svg>
      </button>

    </div>

    <!-- HIDDEN FILE INPUTS -->
    <input type="file" id="fileInput" hidden>

    <input
      type="file"
      id="photoInput"
      accept="image/*"
      hidden
    >

    <input
      type="file"
      id="cameraInput"
      accept="image/*"
      capture="environment"
      hidden
    >

    <!-- IMAGE PREVIEW -->
    <div id="imagePreview" class="image-preview" style="display:none;">
      <img id="previewImage" src="" alt="Selected image">

      <button id="removeImageButton" type="button" title="Remove image">
        ×
      </button>
    </div>

    <!-- TEXT BOX -->
    <div class="text-box-wrapper">

      <!-- PLUS -->
      <button id="plusButton" type="button" title="More">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none"
          stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>

      <!-- TEXT INPUT -->
      <textarea
        id="userInput"
        placeholder="Ask anything..."
        rows="1"
      ></textarea>

      <!-- SEND -->
      <button id="sendButton" type="button" title="Send">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none"
          stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>

    </div>

    <!-- FILE NAME / STATUS -->
    <div id="fileName"></div>

  </div>

</div>

<script src="script.js"></script>


</body>
</html>
